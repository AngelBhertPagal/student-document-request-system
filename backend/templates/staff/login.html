{% extends 'staff/base.html' %}

{% block title %}Records Staff Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-3">
                        <i class="bi bi-shield-check fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Staff Portal</h3>
                    <p class="text-muted small">Registrar & Records Office Personnel Sign In</p>
                </div>

                <form method="POST" action="{% url 'staff-login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                    </button>
                </form>

                <div class="mt-4 p-3 bg-light rounded-3 border small">
                    <div class="fw-bold text-muted mb-1"><i class="bi bi-info-circle me-1"></i> Demo Credentials:</div>
                    <div><strong>Staff Account:</strong> <code>staff</code> / <code>staff123</code></div>
                    <div><strong>Admin Account:</strong> <code>admin</code> / <code>admin123</code></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
